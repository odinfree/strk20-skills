name: Local prover starter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check helper behavior
        run: python3 -m unittest discover -s skills/strk20-local-prover/assets/local-prover/tests -v
      - name: Validate Compose without credentials or starting a service
        env:
          RPC_URL: https://example.invalid/rpc
        run: docker compose -f skills/strk20-local-prover/assets/local-prover/compose.yaml config --quiet
